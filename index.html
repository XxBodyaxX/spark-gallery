<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Spark Gallery</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body { margin:0; font-family:sans-serif; transition:background 0.3s,color 0.3s; }
    .page { display:none; padding:20px; }
    .page.active { display:block; }
    .navbar { position:fixed; bottom:0; left:0; width:100%; display:flex; background:#222; color:#fff; }
    .nav-item { flex:1; text-align:center; padding:10px; cursor:pointer; }
    .nav-item.active { background:#444; }
    .modal { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); display:none; align-items:center; justify-content:center; z-index:1000; }
    .modal.active { display:flex; }
    .modal-content { background:#fff; padding:20px; border-radius:8px; width:90%; max-width:500px; }
    .post-card { background:#eee; margin:10px 0; padding:10px; border-radius:8px; }
    .post-media { width:100%; border-radius:8px; }
    .action-btn { margin-right:10px; cursor:pointer; }
    .liked { color:red; }
    .favorited { color:gold; }
  </style>
</head>
<body>

<div class="page active" id="profilePage">
  <h2>Профиль</h2>
  <p>Имя: <span id="profileName"></span></p>
  <p>Ник: <span id="profileUsername"></span></p>
  <p>Титул: <span id="profileRank">Новичок</span></p>
</div>

<div class="page" id="galleryPage">
  <h2>Галерея</h2>
  <button onclick="openModal()">Создать пост</button>
  <div id="postsGrid"></div>
</div>

<div class="page" id="settingsPage">
  <h2>Настройки</h2>
  <label>Тема:
    <select id="themeSelect">
      <option value="light">Светлая</option>
      <option value="dark">Тёмная</option>
      <option value="halloween">Halloween</option>
    </select>
  </label>
</div>

<div class="navbar">
  <div class="nav-item active" data-page="profile">👤</div>
  <div class="nav-item" data-page="gallery">🖼️</div>
  <div class="nav-item" data-page="settings">⚙️</div>
</div>

<div class="modal" id="createModal">
  <div class="modal-content">
    <h3>Новый пост</h3>
    <form id="createPostForm">
      <input type="file" id="fileInput" accept="image/*,video/*" required><br><br>
      <input type="text" id="postName" placeholder="Название" required><br><br>
      <textarea id="description" placeholder="Описание" required></textarea><br><br>
      <input type="text" id="hashtags" placeholder="#теги"><br><br>
      <button type="submit">Опубликовать</button>
    </form>
  </div>
</div>

<script>
  const tg = window.Telegram.WebApp;
  tg.ready();
  const user = tg.initDataUnsafe.user || { username: "guest", first_name: "Гость" };
  const isAdmin = user.username === "GreatTeacherOn1dzuka";
  document.getElementById("profileName").textContent = user.first_name;
  document.getElementById("profileUsername").textContent = "@" + user.username;

  let posts = [];

  document.querySelectorAll(".nav-item").forEach(item => {
    item.addEventListener("click", () => {
      document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
      document.getElementById(item.dataset.page + "Page").classList.add("active");
      document.querySelectorAll(".nav-item").forEach(n => n.classList.remove("active"));
      item.classList.add("active");
    });
  });

  document.getElementById("themeSelect").addEventListener("change", e => {
    document.body.className = e.target.value;
  });

  function openModal() {
    document.getElementById("createModal").classList.add("active");
  }

  document.getElementById("createPostForm").addEventListener("submit", e => {
    e.preventDefault();
    const file = document.getElementById("fileInput").files[0];
    const name = document.getElementById("postName").value;
    const desc = document.getElementById("description").value;
    const tags = document.getElementById("hashtags").value.split(" ").filter(t => t.startsWith("#"));
    const url = URL.createObjectURL(file);
    const type = file.type.startsWith("image") ? "image" : "video";
    const post = {
      id: Date.now(),
      author: user.username,
      name,
      desc,
      tags,
      url,
      type,
      likes: [],
      favorited: false
    };
    posts.unshift(post);
    renderPosts();
    document.getElementById("createModal").classList.remove("active");
    e.target.reset();
  });

  function renderPosts() {
    const grid = document.getElementById("postsGrid");
    grid.innerHTML = "";
    posts.forEach(post => {
      const card = document.createElement("div");
      card.className = "post-card";
      card.innerHTML = `
        ${post.type === "image" ? `<img src="${post.url}" class="post-media">` : `<video src="${post.url}" class="post-media" controls></video>`}
        <h4>${post.name}</h4>
        <p>${post.desc}</p>
        <p>${post.tags.join(" ")}</p>
        <button class="action-btn ${post.likes.includes(user.username) ? 'liked' : ''}" onclick="toggleLike(${post.id})">❤️ ${post.likes.length}</button>
        <button class="action-btn ${post.favorited ? 'favorited' : ''}" onclick="toggleFav(${post.id})">⭐</button>
        ${isAdmin || post.author === user.username ? `<button class="action-btn" onclick="deletePost(${post.id})">🗑️</button>` : ""}
        <small>Автор: ${post.author}</small>
      `;
      grid.appendChild(card);
    });
  }

  function toggleLike(id) {
    const post = posts.find(p => p.id === id);
    if (!post) return;
    const i = post.likes.indexOf(user.username);
    if (i >= 0) post.likes.splice(i, 1);
    else post.likes.push(user.username);
    renderPosts();
  }

  function toggleFav(id) {
    const post = posts.find(p => p.id === id);
    if (!post) return;
    post.favorited = !post.favorited;
    renderPosts();
  }

  function deletePost(id) {
    if (confirm("Удалить пост?")) {
      if (confirm("Точно удалить?")) {
        posts = posts.filter(p => p.id !== id);
        renderPosts();
      }
    }
  }
</script>

</body>
</html>
