<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spark Галерея</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background:#1a1a1a; color:#fff; min-height:100vh; padding-bottom:70px; }

    body.halloween { background:#1a1a1a; --color-primary:#ff6b00; --color-secondary:#ff3d00; --bg-card:#3a3a3a; }
    body.night { background:#0b0b2b; --color-primary:#00ffff; --color-secondary:#ff00ff; --bg-card:#222244; }
    body.day { background:#f0f8ff; color:#333; --color-primary:#ff6b00; --color-secondary:#ff3d00; --bg-card:#fff; }
    body.kawaii { background:#fff0f6; color:#333; --color-primary:#ff6b9d; --color-secondary:#ffa4c9; --bg-card:#fff0f3; }
    body.cyberpunk { background:#0a0e27; --color-primary:#00ffff; --color-secondary:#ff00ff; --bg-card:#252b48; }
    body.autumn { background:#fdf3e7; color:#333; --color-primary:#ff6b00; --color-secondary:#ff8c00; --bg-card:#fff5e6; }

    .login-screen, .welcome-screen { position:fixed; top:0; left:0; right:0; bottom:0; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px; background:inherit; z-index:4000; }
    .login-screen.hidden, .welcome-screen.hidden { display:none; }

    .login-logo, .welcome-logo { font-size:60px; margin-bottom:10px; }
    .login-title, .welcome-title { font-size:28px; font-weight:bold; color:var(--color-primary); margin-bottom:20px; text-align:center; }

    .login-buttons { display:flex; flex-direction:column; gap:15px; width:100%; max-width:300px; }
    .login-btn { padding:14px; border:none; border-radius:12px; font-size:16px; font-weight:600; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:10px; background:linear-gradient(135deg, var(--color-primary), var(--color-secondary)); color:white; }
    
    .storage-bar { background: var(--bg-card); padding:10px 15px; margin-bottom:15px; border-radius:10px; }
    .storage-info { display:flex; justify-content:space-between; font-size:12px; margin-bottom:5px; }
    .storage-progress { height:6px; background:rgba(0,0,0,0.2); border-radius:10px; overflow:hidden; }
    .storage-fill { height:100%; background:linear-gradient(135deg,var(--color-primary),var(--color-secondary)); transition:width 0.3s; }

    .profile-header { background:linear-gradient(135deg,var(--color-primary),var(--color-secondary)); padding:30px 15px 20px; border-radius:15px; text-align:center; color:white; margin-bottom:15px; position:relative; }
    .profile-avatar { width:100px; height:100px; border-radius:50%; background:rgba(255,255,255,0.3); display:flex; align-items:center; justify-content:center; font-size:48px; margin:0 auto 10px; border:3px solid white; overflow:hidden; }
    .profile-avatar img { width:100%; height:100%; object-fit:cover; border-radius:50%; }
    .profile-name { font-size:20px; font-weight:600; }
    .profile-username { opacity:0.8; font-size:14px; }
    .profile-title { background: rgba(0,0,0,0.3); padding:5px 12px; border-radius:15px; font-size:12px; margin-top:5px; display:inline-block; }

    .profile-stats { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:15px; }
    .stat-card { background: var(--bg-card); padding:10px; border-radius:10px; text-align:center; }
    .stat-value { font-size:18px; font-weight:bold; color:var(--color-primary); }
    .stat-label { font-size:12px; color:#999; }

    .page { display:none; padding:10px; }
    .page.active { display:block; }

    .navbar { position:fixed; bottom:0; left:0; right:0; background:var(--bg-card); display:flex; justify-content:space-around; padding:10px 0; z-index:1000; }
    .nav-item { display:flex; flex-direction:column; align-items:center; gap:2px; cursor:pointer; padding:5px 10px; border-radius:10px; }
    .nav-item.active { background:linear-gradient(135deg,var(--color-primary),var(--color-secondary)); }
    .nav-icon { font-size:20px; }
    .nav-label { font-size:10px; color:#999; }
    .nav-item.active .nav-label { color:white; }

    .gallery-controls { display:flex; gap:5px; margin-bottom:10px; }
    .filter-select { flex:1; padding:8px; border-radius:8px; border:none; background:var(--bg-card); color:inherit; }
    .add-post-btn { width:40px; height:40px; border-radius:50%; background:linear-gradient(135deg,var(--color-primary),var(--color-secondary)); color:white; border:none; font-size:24px; cursor:pointer; }

    .posts-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:10px; }
    .post-card { background: var(--bg-card); border-radius:10px; overflow:hidden; position:relative; }
    .post-card img, .post-card video { width:100%; height:100px; object-fit:cover; }
    .post-content { padding:5px; font-size:12px; }
    .post-description { font-size:12px; margin-bottom:2px; }
    .post-hashtags { font-size:10px; color:#999; }

    /* модальные окна */
    .modal { display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.8); justify-content:center; align-items:center; padding:10px; z-index:2000; }
    .modal.active { display:flex; }
    .modal-content { background:var(--bg-card); border-radius:12px; padding:10px; width:100%; max-width:350px; }
    .close-btn { position:absolute; top:5px; right:10px; font-size:20px; background:none; border:none; color:#999; cursor:pointer; }
</style>
</head>
<body class="halloween">

<div class="login-screen" id="loginScreen">
    <div class="login-logo">🎇</div>
    <h1 class="login-title">Spark Галерея</h1>
    <div class="login-buttons">
        <button class="login-btn" onclick="loginWithTelegram()">✈️ Войти через Telegram</button>
    </div>
</div>

<div class="welcome-screen hidden" id="welcomeScreen">
    <div class="welcome-logo">🎇</div>
    <h1 class="welcome-title">Добро пожаловать!</h1>
    <div style="background:var(--bg-card); padding:15px; border-radius:10px; margin-bottom:10px;">
        <p>📌 Правила: запрещена порнография, оскорбления других, политический контент.</p>
    </div>
    <button class="login-btn" onclick="closeWelcome()">Начать</button>
</div>

<div class="page active" id="profilePage">
    <div class="storage-bar">
        <div class="storage-info"><span>Хранилище</span><span id="storageText">0 МБ / 500 МБ</span></div>
        <div class="storage-progress"><div class="storage-fill" id="storageFill" style="width:0%"></div></div>
    </div>

    <div class="profile-header">
        <div class="profile-avatar" id="profileAvatar">?</div>
        <div class="profile-name" id="profileName">Пользователь</div>
        <div class="profile-username" id="profileUsername">@username</div>
        <div class="profile-title" id="profileTitle">Создатель Spark</div>
    </div>

    <div class="profile-stats">
        <div class="stat-card"><div class="stat-value" id="postsCount">0</div><div class="stat-label">Постов</div></div>
        <div class="stat-card"><div class="stat-value" id="likesCount">0</div><div class="stat-label">Лайков</div></div>
        <div class="stat-card"><div class="stat-value" id="favoritesCount">0</div><div class="stat-label">Избранное</div></div>
    </div>
</div>

<div class="page" id="galleryPage">
    <div class="gallery-controls">
        <select class="filter-select" id="filterDate">
            <option value="all">Все</option>
            <option value="day">Сегодня</option>
            <option value="week">Эта неделя</option>
            <option value="month">Этот месяц</option>
        </select>
        <button class="add-post-btn" onclick="openCreateModal()">+</button>
    </div>
    <div class="posts-grid" id="postsGrid"></div>
</div>

<div class="navbar">
    <div class="nav-item active" onclick="switchPage('profile')"><div class="nav-icon">👤</div><div class="nav-label">Профиль</div></div>
    <div class="nav-item" onclick="switchPage('gallery')"><div class="nav-icon">🖼️</div><div class="nav-label">Галерея</div></div>
</div>

<!-- модалка для нового поста -->
<div class="modal" id="createModal">
    <div class="modal-content">
        <button class="close-btn" onclick="closeCreateModal()">×</button>
        <h3>Новый пост</h3>
        <input type="file" id="postFile" accept="image/*,video/*"><br><br>
        <input type="text" id="postName" placeholder="Название"><br><br>
        <textarea id="postDesc" placeholder="Описание"></textarea><br><br>
        <input type="text" id="postTags" placeholder="#хэштеги"><br><br>
        <button onclick="createPost()">Опубликовать</button>
    </div>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

let posts = [];
let storageUsed = 0;

// Админский ID Telegram
const adminId = 123456789; // сюда свой ID

function checkLogin() {
    const user = tg.initDataUnsafe.user;
    if(!user) return alert("Ошибка Telegram");
    localStorage.setItem('userData', JSON.stringify(user));
    document.getElementById('profileName').textContent = user.first_name;
    document.getElementById('profileUsername').textContent = '@'+(user.username||('tguser'+Date.now()));
    if(user.photo_url){
        document.getElementById('profileAvatar').innerHTML = `<img src="${user.photo_url}">`;
    }else{
        document.getElementById('profileAvatar').textContent = user.first_name.charAt(0).toUpperCase();
    }
    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('welcomeScreen').classList.remove('hidden');
}

function closeWelcome() { document.getElementById('welcomeScreen').classList.add('hidden'); }

function switchPage(page){
    document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
    document.getElementById(page+'Page').classList.add('active');
    document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
    const idx = {profile:0,gallery:1};
    document.querySelectorAll('.nav-item')[idx[page]].classList.add('active');
}

function openCreateModal(){ document.getElementById('createModal').classList.add('active'); }
function closeCreateModal(){ document.getElementById('createModal').classList.remove('active'); }

function createPost(){
    const file = document.getElementById('postFile').files[0];
    const name = document.getElementById('postName').value;
    const desc = document.getElementById('postDesc').value;
    const tags = document.getElementById('postTags').value;

    if(!file || !name) return alert("Выберите файл и укажите название");

    const reader = new FileReader();
    reader.onload = function(e){
        posts.push({file:e.target.result, name, desc, tags, date:new Date()});
        renderPosts();
        closeCreateModal();
    }
    reader.readAsDataURL(file);
}

function renderPosts(){
    const container = document.getElementById('postsGrid');
    container.innerHTML='';
    if(posts.length===0) container.innerHTML='<p style="color:#999;text-align:center;">Нет постов</p>';
    posts.forEach(p=>{
        const el = document.createElement('div');
        el.className='post-card';
        if(p.file.includes('video')) el.innerHTML=`<video src="${p.file}" controls></video>`;
        else el.innerHTML=`<img src="${p.file}">`;
        const content = document.createElement('div');
        content.className='post-content';
        content.innerHTML=`<div class="post-description">${p.desc}</div><div class="post-hashtags">${p.tags}</div>`;
        el.appendChild(content);
        container.appendChild(el);
    });
}

document.addEventListener('DOMContentLoaded', checkLogin);
</script>

</body>
</html>
