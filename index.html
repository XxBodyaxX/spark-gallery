<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spark Gallery</title>

<!-- Telegram API -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<!-- Tailwind -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- Custom CSS -->
<link rel="stylesheet" href="style.css">
</head>

<body class="bg-black text-white flex flex-col min-h-screen">

<!-- Контент -->
<main class="flex-1 p-4">

    <!-- Галерея -->
    <section id="gallery-section" class="tab-section">
        <h1 class="text-xl font-bold mb-4">Галерея</h1>
        <div id="gallery-list" class="grid gap-4"></div>
    </section>

    <!-- Избранное -->
    <section id="favorites-section" class="tab-section hidden">
        <h1 class="text-xl font-bold mb-4">Избранное</h1>
        <div id="favorites-list" class="grid gap-4"></div>
    </section>

    <!-- Профиль -->
    <section id="profile-section" class="tab-section hidden">
        <h1 class="text-xl font-bold mb-4">Профиль</h1>
        <p>Данные пользователя Telegram будут здесь</p>
    </section>

</main>

<!-- Навигация -->
<nav class="bg-neutral-900 p-3 flex justify-around border-t border-neutral-700">
    <button onclick="showTab('gallery')" id="tab-gallery" class="tab-btn active-tab">🏠</button>
    <button onclick="showTab('favorites')" id="tab-favorites" class="tab-btn">⭐</button>
    <button onclick="showTab('profile')" id="tab-profile" class="tab-btn">👤</button>
</nav>

<!-- JS -->
<script src="app.js"></script>
</body>
</html>
