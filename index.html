<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spark Галерея</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:#1a1a1a; color:#fff; min-height:100vh; padding-bottom:70px;}
    body.halloween{--color-primary:#ff6b00;--color-secondary:#ff3d00;--bg-card:#3a3a3a;}
    body.night{--color-primary:#0f0f3f;--color-secondary:#3333aa;--bg-card:#1a1a2a;}
    body.day{--color-primary:#00aaff;--color-secondary:#00ffaa;--bg-card:#e0f7ff; color:#000;}
    body.cute{--color-primary:#ff6b9d;--color-secondary:#ffa4c9;--bg-card:#fff0f3; color:#333;}
    body.cyberpunk{--color-primary:#00ffff;--color-secondary:#ff00ff;--bg-card:#252b48;}
    body.autumn{--color-primary:#ff9933;--color-secondary:#ffcc66;--bg-card:#3a2a1a;}
    body::before{content:'🎃';position:fixed;top:10px;right:10px;font-size:30px;animation:float 3s ease-in-out infinite;}
    body.night::before{content:'🌙';}
    body.day::before{content:'☀️';}
    body.cute::before{content:'🌸';}
    body.cyberpunk::before{content:'🤖';}
    body.autumn::before{content:'🍁';}
    @keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-10px);}}
    .login-screen,.welcome-screen,.page,.modal{position:fixed;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;z-index:1000;}
    .hidden{display:none !important;}
    .login-title,.welcome-title{font-size:28px;font-weight:bold;margin-bottom:20px;}
    .login-buttons button{margin:5px;padding:12px 20px;font-size:16px;border-radius:10px;border:none;cursor:pointer;}
    .login-btn{background:linear-gradient(135deg,var(--color-primary) 0%,var(--color-secondary) 100%);color:#fff;}
    .welcome-rules{background:var(--bg-card);padding:20px;border-radius:15px;margin-bottom:20px;max-width:400px;}
    .welcome-rules li{padding-left:20px;position:relative;}
    .welcome-rules li::before{content:'•';position:absolute;left:0;}
    .welcome-btn{padding:12px 30px;border-radius:10px;border:none;background:linear-gradient(135deg,var(--color-primary) 0%,var(--color-secondary) 100%);color:#fff;cursor:pointer;}
    .navbar{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;background:var(--bg-card);padding:10px;}
    .nav-item{display:flex;flex-direction:column;align-items:center;cursor:pointer;}
    .nav-item.active{background:linear-gradient(135deg,var(--color-primary) 0%,var(--color-secondary) 100%);border-radius:10px;}
    .page{padding:15px;overflow-y:auto;width:100%;display:none;}
    .page.active{display:block;}
    .profile-header{background:linear-gradient(135deg,var(--color-primary) 0%,var(--color-secondary) 100%);padding:30px;border-radius:15px;text-align:center;}
    .profile-avatar{width:80px;height:80px;border-radius:50%;background:rgba(255,255,255,0.3);display:flex;align-items:center;justify-content:center;font-size:32px;margin:0 auto 10px;border:3px solid white;}
    .profile-rank{display:inline-block;background:rgba(0,0,0,0.3);padding:5px 10px;border-radius:12px;margin-top:5px;font-size:12px;}
    .profile-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:15px;}
    .stat-card{background:var(--bg-card);padding:10px;border-radius:12px;text-align:center;}
    .posts-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:15px;}
    .post-card{background:var(--bg-card);border-radius:12px;overflow:hidden;position:relative;}
    .post-card img,.post-card video{width:100%;height:150px;object-fit:cover;}
    .post-content{padding:10px;}
    .modal-content{background:var(--bg-card);padding:20px;border-radius:15px;width:100%;max-width:400px;}
    .close-btn{position:absolute;top:10px;right:10px;font-size:20px;background:none;border:none;color:#999;cursor:pointer;}
    .form-group{margin-bottom:15px;}
    .form-label{margin-bottom:5px;display:block;}
    .form-input,.form-textarea{width:100%;padding:10px;border-radius:8px;border:none;background:rgba(0,0,0,0.2);color:inherit;}
    .submit-btn{padding:10px 20px;border:none;border-radius:10px;background:linear-gradient(135deg,var(--color-primary) 0%,var(--color-secondary) 100%);color:#fff;cursor:pointer;width:100%;}
</style>
</head>
<body class="halloween">
<div class="login-screen" id="loginScreen">
    <div class="login-title">Spark Галерея</div>
    <p>Вход через Telegram</p>
    <div class="login-buttons">
        <button class="login-btn" onclick="loginTelegram()">Войти</button>
    </div>
</div>

<div class="welcome-screen hidden" id="welcomeScreen">
    <div class="welcome-title">Добро пожаловать!</div>
    <ul class="welcome-rules">
        <li>Порнография запрещена</li>
        <li>Оскорбления и агрессия запрещены</li>
        <li>Политика запрещена</li>
        <li>Будьте культурны</li>
    </ul>
    <button class="welcome-btn" onclick="closeWelcome()">Начать</button>
</div>

<div class="page active" id="profilePage">
    <div class="profile-header">
        <div class="profile-avatar" id="profileAvatar">?</div>
        <div id="profileName">Пользователь</div>
        <div id="profileUsername">@username</div>
        <div class="profile-rank" id="profileRank">🎃 Новичок</div>
    </div>
    <div class="profile-stats">
        <div class="stat-card"><div id="postsCount">0</div>Постов</div>
        <div class="stat-card"><div id="likesCount">0</div>Лайков</div>
        <div class="stat-card"><div id="favoritesCount">0</div>Избранное</div>
    </div>
</div>

<div class="page" id="galleryPage">
    <button class="submit-btn" onclick="openCreateModal()">Создать пост</button>
    <select id="filterSelect" onchange="renderPosts()">
        <option value="all">Все</option>
        <option value="today">Сегодня</option>
        <option value="week">Эта неделя</option>
        <option value="month">Этот месяц</option>
        <option value="year">Этот год</option>
    </select>
    <div class="posts-grid" id="postsGrid"></div>
</div>

<div class="navbar">
    <div class="nav-item active" onclick="switchPage('profile')">👤 Профиль</div>
    <div class="nav-item" onclick="switchPage('gallery')">🖼 Галерея</div>
</div>

<div class="modal hidden" id="createModal">
    <div class="modal-content">
        <button class="close-btn" onclick="closeCreateModal()">×</button>
        <h3>Создать пост</h3>
        <form id="createPostForm" onsubmit="createPost(event)">
            <div class="form-group">
                <label>Фото/Видео</label>
                <input type="file" id="fileInput" accept="image/*,video/*" onchange="previewFile(event)">
                <div id="filePreview"></div>
            </div>
            <div class="form-group">
                <label>Описание</label>
                <textarea id="description" class="form-textarea"></textarea>
            </div>
            <div class="form-group">
                <label>Хэштеги</label>
                <input type="text" id="hashtags" class="form-input" placeholder="#пример">
            </div>
            <button class="submit-btn" type="submit">Опубликовать</button>
        </form>
    </div>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

let posts = [];
let userData = {};
let adminUsername = "AdminTG"; // Ник админа для фона и управления
let storageUsed = 0;

function loginTelegram(){
    const user = tg.initDataUnsafe.user;
    userData = user ? {firstName:user.first_name, username:user.username} : {firstName:"TelegramUser", username:"tguser"};
    document.getElementById('profileName').textContent = userData.firstName;
    document.getElementById('profileUsername').textContent = '@'+userData.username;
    document.getElementById('profileAvatar').textContent = userData.firstName.charAt(0).toUpperCase();
    localStorage.setItem('userData', JSON.stringify(userData));
    document.getElementById('loginScreen').classList.add('hidden');
    if(!localStorage.getItem('hasSeenWelcome')) document.getElementById('welcomeScreen').classList.remove('hidden');
}

function closeWelcome(){
    localStorage.setItem('hasSeenWelcome', 'true');
    document.getElementById('welcomeScreen').classList.add('hidden');
}

function switchPage(page){
    document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
    document.getElementById(page+'Page').classList.add('active');
}

function openCreateModal(){document.getElementById('createModal').classList.remove('hidden');}
function closeCreateModal(){document.getElementById('createModal').classList.add('hidden');}
function previewFile(event){
    const file = event.target.files[0];
    const preview = document.getElementById('filePreview');
    preview.innerHTML = "";
    if(!file) return;
    const url = URL.createObjectURL(file);
    if(file.type.startsWith('image')) preview.innerHTML=`<img src="${url}">`;
    else if(file.type.startsWith('video')) preview.innerHTML=`<video src="${url}" controls></video>`;
}

function createPost(e){
    e.preventDefault();
    const description = document.getElementById('description').value;
    let hashtags = document.getElementById('hashtags').value;
    hashtags = hashtags.split(' ').map(t=>t.startsWith('#')?t:'#'+t).join(' ');
    const fileInput = document.getElementById('fileInput');
    if(!fileInput.files[0]) {alert('Выберите файл'); return;}
    const post = {id:Date.now(), user:userData.username, firstName:userData.firstName, description, hashtags, file:URL.createObjectURL(fileInput.files[0]), date:new Date()};
    posts.unshift(post);
    localStorage.setItem('posts', JSON.stringify(posts));
    renderPosts();
    closeCreateModal();
}

function renderPosts(){
    const grid = document.getElementById('postsGrid');
    grid.innerHTML = "";
    posts.forEach(post=>{
        const div = document.createElement('div');
        div.className='post-card';
        div.innerHTML=`${post.file.endsWith('.mp4')?`<video src="${post.file}" controls></video>`:`<img src="${post.file}">`}
        <div class="post-content">
            <strong>${post.firstName}</strong><br>
            ${post.description}<br>
            <em>${post.hashtags}</em>
        </div>`;
        if(post.user===userData.username || userData.username===adminUsername){
            const delBtn = document.createElement('button');
            delBtn.textContent='Удалить';
            delBtn.onclick=()=>{if(confirm('Вы точно хотите удалить?')){posts=posts.filter(p=>p.id!==post.id);localStorage.setItem('posts',JSON.stringify(posts));renderPosts();}};
            div.appendChild(delBtn);
        }
        grid.appendChild(div);
    });
}

// Загрузка данных
window.onload=()=>{
    posts=JSON.parse(localStorage.getItem('posts')||'[]');
    if(localStorage.getItem('userData')) userData=JSON.parse(localStorage.getItem('userData'));
    renderPosts();
};
</script>
</body>
</html>
